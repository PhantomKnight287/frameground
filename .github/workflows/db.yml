name: Run Migrations and Update Challenges

on:
  push:
    branches:
      - main

jobs:
  run_migrations:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install pnpm
        run: corepack enable pnpm
      - name: Install Dependencies
        run: pnpm install
      - name: Run Migrations
        # `migrate deploy` is the CI/production command: it only applies pending
        # migrations. `migrate dev` is for local development - it diffs the schema,
        # writes brand new migrations into the (throwaway) checkout, and offers to
        # reset the database when it finds drift.
        run: |
          cd packages/db && npx prisma migrate deploy
      - name: Update Challenges
        run: |
          cd packages/db && pnpm build && node dist/scripts/index.js
